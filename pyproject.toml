[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turkmopet-warehouse-ops"
version = "0.8.0"
description = "Warehouse stock reconciliation and issue workflow tools for Türkmopet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enes Akın" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
warehouse-reconcile = "warehouse_ops.cli:main"
warehouse-tasks = "warehouse_ops.task_cli:main"

[tool.setuptools.packages.find]
include = ["warehouse_ops*"]
